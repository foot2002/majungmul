# Development source-IP access is managed by the EC2 security group.
server {
    listen 8080;
    server_name 16.208.56.91 ec2-16-208-56-91.ap-northeast-3.compute.amazonaws.com;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Majungmul-Environment dev always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 12m;
    access_log /var/log/nginx/majungmul-dev.access.log;
    error_log /var/log/nginx/majungmul-dev.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        # Current dev app is stateless. Prevent shared-IP production cookies
        # from reaching dev or being overwritten. Revisit when DB auth is merged;
        # use a separate hostname/SSH tunnel for true cookie isolation.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
}
